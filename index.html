<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeynebin Her Şeyi</title>
    <style>
        :root {
            --primary-pink: #ff69b4;
            --light-pink: #ffb6c1;
            --pale-pink: #ffe4e1;
            --dark-pink: #d81b60;
            --bg-color: #fff0f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Telefon Çerçevesi Görünümü */
        .phone-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            border-radius: 0;
        }

        @media (min-width: 450px) {
            .phone-container {
                border-radius: 40px;
                height: 90vh;
                border: 8px solid #fff;
            }
        }

        /* Üst Başlık */
        .header {
            background: linear-gradient(135deg, var(--primary-pink), var(--dark-pink));
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        /* İçerik Alanı */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }

        .content.active {
            display: flex;
            flex-direction: column;
        }

        /* Sekme 1: Sohbet Stili */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 10px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message.incoming {
            background: var(--pale-pink);
            color: #4a4a4a;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.outgoing {
            background: var(--primary-pink);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--light-pink);
            border-radius: 25px;
            outline: none;
            font-size: 0.9rem;
        }

        .chat-input-area input:focus {
            border-color: var(--primary-pink);
        }

        .chat-input-area button {
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Sekme 2: Yapılacaklar Listesi */
        .todo-input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .todo-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid var(--light-pink);
            border-radius: 15px;
            outline: none;
        }

        .todo-input-area button {
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .todo-item {
            background: var(--pale-pink);
            padding: 12px 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .todo-item.completed span {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .todo-item button {
            background: none;
            border: none;
            color: var(--dark-pink);
            cursor: pointer;
            font-weight: bold;
        }

        /* Sekme 3: Fotoğraflar / Anılar */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .photo-card {
            background: var(--pale-pink);
            height: 150px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--dark-pink);
            font-size: 0.85rem;
            text-align: center;
            border: 2px dashed var(--light-pink);
            overflow: hidden;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Alt Navigasyon Menüsü */
        .nav-bar {
            height: 70px;
            background: white;
            border-top: 1px solid var(--pale-pink);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: #888;
            font-size: 0.75rem;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--dark-pink);
            font-weight: bold;
        }

        .nav-item span.icon {
            font-size: 1.4rem;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Üst Başlık -->
        <div class="header">
            <h1>Zeynebin Her Şeyi</h1>
            <p>Kişisel Asistanın 🤍</p>
        </div>

        <!-- 1. Sekme: Sohbet -->
        <div id="tab-chat" class="content active">
            <div class="chat-messages" id="chatMessages">
                <div class="message incoming">Efendim Zeynep? Yine neyi merak ettin bakalım? 😊</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Bir şeyler yaz..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Gönder</button>
            </div>
        </div>

        <!-- 2. Sekme: Yapılacaklar -->
        <div id="tab-todo" class="content">
            <div class="todo-input-area">
                <input type="text" id="todoInput" placeholder="Bugün ne yapman gerekiyor?">
                <button onclick="addTodo()">Ekle</button>
            </div>
            <ul class="todo-list" id="todoList">
                <!-- Örnek Görev -->
                <li class="todo-item">
                    <span>Erken uyan ve kahve iç ☕</span>
                    <button onclick="removeTodo(this)">Sil</button>
                </li>
            </ul>
        </div>

        <!-- 3. Sekme: Anılar / Fotoğraflar -->
        <div id="tab-photos" class="content">
            <div class="photo-grid">
                <div class="photo-card">Fotoğraf 1<br>(Buraya eklenecek)</div>
                <div class="photo-card">Fotoğraf 2<br>(Buraya eklenecek)</div>
                <div class="photo-card">Fotoğraf 3<br>(Buraya eklenecek)</div>
                <div class="photo-card">Fotoğraf 4<br>(Buraya eklenecek)</div>
            </div>
        </div>

        <!-- Alt Menü -->
        <div class="nav-bar">
            <button class="nav-item active" onclick="switchTab('chat', this)">
                <span class="icon">💬</span>
                Sohbet
            </button>
            <button class="nav-item" onclick="switchTab('todo', this)">
                <span class="icon">📋</span>
                Yapılacaklar
            </button>
            <button class="nav-item" onclick="switchTab('photos', this)">
                <span class="icon">📸</span>
                Anılar
            </button>
        </div>
    </div>

    <script>
        // Sekme Değiştirme Fonksiyonu
        function switchTab(tabName, element) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');
        }

        // Sohbet Mesaj Gönderme
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const chatMessages = document.getElementById('chatMessages');
            
            if (input.value.trim() === '') return;

            // Zeynep'in mesajı
            const userMsg = document.createElement('div');
            userMsg.className = 'message outgoing';
            userMsg.textContent = input.value;
            chatMessages.appendChild(userMsg);

            const textToSend = input.value;
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Yapay Zeka Cevap Simülasyonu (Buraya ileride senin klonunu bağlayacağız)
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message incoming';
                aiMsg.textContent = "Bunu şu an sadece simülasyon olarak söylüyorum ama yakında senin ağzından konuşacak! 😎";
                chatMessages.appendChild(aiMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 1000);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        // Yapılacaklar Listesi Ekleme
        function addTodo() {
            const input = document.getElementById('todoInput');
            const list = document.getElementById('todoList');

            if (input.value.trim() === '') return;

            const li = document.createElement('li');
            li.className = 'todo-item';
            li.innerHTML = `<span>${input.value}</span><button onclick="removeTodo(this)">Sil</button>`;
            
            // Tıklayınca üstünü çizme
            li.querySelector('span').onclick = function() {
                li.classList.toggle('completed');
            };

            list.appendChild(li);
            input.value = '';
        }

        function removeTodo(button) {
            button.parentElement.remove();
        }
    </script>
</body>
</html>
