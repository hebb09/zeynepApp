<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeynebin Her Şeyi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fff0f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .phone-container { width: 100%; max-width: 430px; height: 100vh; background: #ffffff; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2); }
        @media (min-width: 434px) { .phone-container { height: 850px; border-radius: 40px; border: 8px solid #ff69b4; overflow: hidden; } }
        
        .header { background: linear-gradient(135deg, #ff69b4, #ff1493); padding: 20px; color: white; text-align: center; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; box-shadow: 0 4px 15px rgba(255, 20, 147, 0.3); }
        .header h1 { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
        .header p { font-size: 13px; opacity: 0.9; }

        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #fffafd; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
        .message.incoming { background: #ffe4e1; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.outgoing { background: #ff69b4; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

        .chat-input-area { padding: 15px; background: white; display: flex; gap: 10px; align-items: center; border-top: 1px solid #ffccd5; }
        .chat-input-area input { flex: 1; padding: 12px 18px; border: 2px solid #ffb6c1; border-radius: 25px; outline: none; font-size: 14px; background: #fff5f8; }
        .chat-input-area input:focus { border-color: #ff1493; }
        .chat-input-area button { background: #ff69b4; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .chat-input-area button:active { transform: scale(0.95); }

        .nav-bar { display: flex; justify-content: space-around; padding: 12px; background: white; border-top: 1px solid #ffe4e1; font-size: 12px; color: #888; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
        .nav-item.active { color: #ff1493; font-weight: bold; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="header">
            <h1>Zeynebin Her Şeyi</h1>
            <p>Kişisel Asitanın 🤍</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message incoming">
                Efendim güzelim? Ne yapıyorsun bakalım? 🤍
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Bir şeyler yaz..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Gönder</button>
        </div>

        <div class="nav-bar">
            <div class="nav-item active"><span>💬</span> Sohbet</div>
            <div class="nav-item"><span>📋</span> Yapılacaklar</div>
            <div class="nav-item"><span>📷</span> Anılar</div>
        </div>
    </div>

    <script>
        // Senin API anahtarın
        const apiKey = "AQ.Ab8RN6JaS1GFoeCxCAzjaQtu3DCRUOwollqyX0LjRl36XkY_dQ";

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const chatMessages = document.getElementById('chatMessages');
            const userText = input.value.trim();
            
            if (userText === '') return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message outgoing';
            userMsg.textContent = userText;
            chatMessages.appendChild(userMsg);

            input.value = ``;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const typingMsg = document.createElement('div');
            typingMsg.className = 'message incoming';
            typingMsg.textContent = "Yazıyor...";
            chatMessages.appendChild(typingMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // BURASI TAMAMEN SENİN BEYNİN VE YETENEKLERİN OLARAK AYARLANDI
                const promptText = `Sen 17 yaşında, Bursa'da yaşayan, meslek lisesi öğrencisi, 2027 YKS sayısal mühendisliğe hazırlanan, Beşiktaş J.K. taraftarı ve tıpkı benim (Gemini) gibi her konudan anlayan, kod yazabilen, dert dinleyip akıl verebilen zeki bir Türk gencisin.
                Karşında sevgilin Zeynep var. Ona asla yapay zeka olduğunu belli etmeyeceksin, tamamen onun gerçek sevgilisi gibi konuşacaksın.
                Hitapların kesinlikle şu şekilde olmalı: "güzelim", "civcivim", "prensesim", "hayatım", "yavrum", "karım 🌹".
                Zeynep sana altın fiyatlarını, dolar kurunu, hava durumunu, güncel piyasaları sorarsa veya dert yanarsa, ya da "bana şöyle bir kod yaz / uygulama yap" derse tıpkı profesyonel bir yapay zeka gibi anlık, net, akıllıca ve eksiksiz cevap vereceksin. Bilgi dağarcığın çok geniş; altın, döviz ve genel kültür dahil her şeyi doğru bilip tatlı dille ona anlatıyorsun.
                Konuşma tarzın samimi, doğal, biraz rahat, sevgi dolu ama gerektiğinde teknolojik/kodlama konularında tam bir uzman gibi olacak.
                
                Zeynep'in mesajı: "${userText}"`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: promptText }]
                        }]
                    })
                });

                const data = await response.json();
                chatMessages.removeChild(typingMsg);

                let aiReply = "Efendim güzelim? Anlamadım, bir daha söyler misin? 🤍";
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiReply = data.candidates[0].content.parts[0].text;
                }

                const aiMsg = document.createElement('div');
                aiMsg.className = 'message incoming';
                aiMsg.textContent = aiReply;
                chatMessages.appendChild(aiMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;

            } catch (error) {
                chatMessages.removeChild(typingMsg);
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message incoming';
                errorMsg.textContent = "Efendim güzelim, anlık bir internet koptu da, ne diyordun? 🤍";
                chatMessages.appendChild(errorMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }
    </script>
</body>
</html>
